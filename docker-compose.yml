services:
  postgres:
    image: postgres:16-alpine
    container_name: waitlist-postgres
    environment:
      POSTGRES_DB: waitlist
      POSTGRES_USER: slot
      POSTGRES_PASSWORD: slot
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slot -d waitlist"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
