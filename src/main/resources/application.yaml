spring:
  application:
    name: waitlist
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/waitlist}
    username: ${DB_USERNAME:slot}
    password: ${DB_PASSWORD:slot}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789abcdef}
    expiration-minutes: 60
  scheduler:
    enabled: true
    expiry-interval-ms: 10000
